name: Respaldo Supabase

# Cada día a las 06:17 UTC (03:17 en Chile continental en horario de verano).
# También se puede lanzar a mano: pestaña Actions > Respaldo Supabase > Run workflow.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo-supabase
  cancel-in-progress: false

jobs:
  respaldo:
    name: Respaldo ${{ matrix.entorno }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Un entorno se omite solo si no tiene su secreto configurado.
        entorno: [STAGING, PROD]
    env:
      ENTORNO: ${{ matrix.entorno }}
      ARCHIVO: respaldo-${{ matrix.entorno }}-${{ github.run_id }}-${{ github.run_attempt }}.dump.gpg
      DB_URL: ${{ matrix.entorno == 'PROD' && secrets.SUPABASE_DB_URL_PROD || secrets.SUPABASE_DB_URL_STAGING }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      PGSSLMODE: require
    services:
      # Base temporal, solo para probar que el respaldo se puede restaurar.
      verificacion:
        image: postgres:17
        env:
          # Base efímera que solo vive durante este job y solo escucha en localhost:
          # sin contraseña (trust), así no hay ninguna credencial escrita en el archivo.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Comprobar configuración
        id: cfg
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::notice::$ENTORNO sin configurar (falta SUPABASE_DB_URL_$ENTORNO o BACKUP_PASSPHRASE); se omite."
            echo "activo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#PASSPHRASE}" -lt 24 ]; then
            echo "::error::BACKUP_PASSPHRASE es demasiado corta (mínimo 24 caracteres)."
            exit 1
          fi
          echo "activo=true" >> "$GITHUB_OUTPUT"

      - name: Instalar cliente PostgreSQL 17
        if: steps.cfg.outputs.activo == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Volcar la base de datos
        if: steps.cfg.outputs.activo == 'true'
        run: |
          set -euo pipefail
          PG=/usr/lib/postgresql/17/bin
          # Solo el esquema public (las tablas de Django). Formato custom: comprimido y restaurable por tabla.
          $PG/pg_dump "$DB_URL" --format=custom --no-owner --no-privileges --schema=public --file=respaldo.dump
          TAMANO=$(stat -c%s respaldo.dump)
          TABLAS=$($PG/pg_restore --list respaldo.dump | grep -c "TABLE DATA" || true)
          echo "Volcado: ${TAMANO} bytes, ${TABLAS} tablas con datos"
          if [ "$TAMANO" -lt 10000 ] || [ "$TABLAS" -lt 5 ]; then
            echo "::error::El volcado parece incompleto; se aborta sin guardar nada."
            exit 1
          fi
          echo "TABLAS=${TABLAS}" >> "$GITHUB_ENV"
          echo "TAMANO=${TAMANO}" >> "$GITHUB_ENV"

      - name: Cifrar (AES-256)
        if: steps.cfg.outputs.activo == 'true'
        run: |
          set -euo pipefail
          # La contraseña pasa por un descriptor, nunca por la línea de comandos ni el log.
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
              --symmetric --cipher-algo AES256 --compress-algo none \
              --output "$ARCHIVO" respaldo.dump 3<<<"$PASSPHRASE"
          sha256sum "$ARCHIVO" > "$ARCHIVO.sha256"

      - name: Probar que se puede restaurar
        if: steps.cfg.outputs.activo == 'true'
        run: |
          set -euo pipefail
          PG=/usr/lib/postgresql/17/bin
          DESTINO="postgresql://postgres@localhost:5432/postgres"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
              --decrypt --output verificacion.dump "$ARCHIVO" 3<<<"$PASSPHRASE"
          # Los avisos de roles/extensiones propios de Supabase no impiden restaurar los datos.
          $PG/pg_restore --no-owner --no-privileges --dbname "$DESTINO" verificacion.dump || true
          CONSULTA="select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'"
          ORIGEN=$($PG/psql "$DB_URL" -tAc "$CONSULTA")
          RESTAURADAS=$($PG/psql "$DESTINO" -tAc "$CONSULTA")
          echo "Tablas en origen: $ORIGEN | restauradas: $RESTAURADAS"
          if [ "$ORIGEN" != "$RESTAURADAS" ]; then
            echo "::error::La restauración de prueba no coincide con el origen."
            exit 1
          fi
          rm -f verificacion.dump respaldo.dump

      - name: Guardar respaldo cifrado
        if: steps.cfg.outputs.activo == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARCHIVO }}
          path: |
            ${{ env.ARCHIVO }}
            ${{ env.ARCHIVO }}.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Resumen
        if: steps.cfg.outputs.activo == 'true'
        run: |
          {
            echo "### Respaldo ${ENTORNO} correcto"
            echo "- Archivo: \`${ARCHIVO}\` (cifrado AES-256)"
            echo "- Tablas con datos: ${TABLAS} | Tamaño sin cifrar: ${TAMANO} bytes"
            echo "- Restauración de prueba: OK"
            echo "- Retención: 30 días"
          } >> "$GITHUB_STEP_SUMMARY"
