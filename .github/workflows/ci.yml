name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'

jobs:
  tests:
    name: Tests y migraciones
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores solo para CI: base SQLite temporal, nada de producción.
      DEBUG: 'False'
      SECRET_KEY: ci-clave-solo-para-pruebas-no-es-secreta-0123456789
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false   # Sonar necesita el historial para atribuir líneas nuevas
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-ci.txt
      - name: Verificar proyecto y migraciones
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests con cobertura
        run: |
          coverage run --source=core,config manage.py test core
          coverage xml -o coverage.xml
          coverage report --skip-empty | tail -n 25
      - name: Guardar cobertura
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  calidad:
    name: Calidad y seguridad (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informativo mientras se limpia la deuda existente (ver reporte). Cuando los tres
    # pasos queden en verde, quitar `continue-on-error` para que bloqueen el merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar herramientas
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-lint.txt
      - name: Ruff (errores reales, no estilo)
        run: ruff check core config --select F,B,E9,S,DJ,PLE --exclude "core/migrations" --exclude "core/test_*.py" --exclude core/tests.py --output-format github
      - name: Bandit (seguridad del código)
        run: bandit -r core config -x core/test_*.py,core/tests.py,core/migrations -ll
      - name: pip-audit (vulnerabilidades en dependencias)
        run: pip-audit -r requirements.txt --no-deps --disable-pip

  sonar:
    name: SonarCloud
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Comprobar configuración
        id: cfg
        env:
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_ORGANIZATION" ]; then
            echo "SonarCloud sin configurar (falta SONAR_TOKEN o variables); se omite."
            echo "activo=false" >> "$GITHUB_OUTPUT"
          else
            echo "activo=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.cfg.outputs.activo == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.cfg.outputs.activo == 'true'
        with:
          name: coverage-xml
      - name: Análisis SonarCloud
        if: steps.cfg.outputs.activo == 'true'
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
