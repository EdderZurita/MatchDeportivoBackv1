# Configuración de análisis SonarCloud (projectKey y organization van como
# variables del repositorio en GitHub, ver docs/CALIDAD.md).
sonar.sources=core,config
sonar.tests=core
sonar.test.inclusions=**/test_*.py,**/tests.py
sonar.exclusions=**/migrations/**,**/__pycache__/**,staticfiles/**
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
